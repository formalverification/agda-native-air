## =============================================================================
#  pages.yml - build and publish the demo site (issue #85)
#  -----------------------------------------------------------------------------
#
#  File: .github/workflows/pages.yml
#
#  Description:
#    Builds the demo site with the same two Makefile targets a developer runs
#    (`make demo-data` then `make demo-site`) and deploys the result to GitHub
#    Pages.  Nothing generated is committed: the page is rebuilt here from
#    `reports/agent-bench/`, which is.
#
#    The build needs Python and nothing else.  It runs no Agda, starts no
#    server, and makes no network request of its own: every input is a file in
#    this repository.  `make demo-data` refuses to write if the table it
#    regenerates from each arm's `report.json` disagrees with ADR 0001 § 9, or
#    if an absolute path from the machine the sweep ran on survived
#    normalization, so a page that cannot be trusted fails this workflow rather
#    than being published.
#
#    The `verify` job is the gate.  It runs the generator's own test suite
#    (`scripts/python/tests/test_demo_*.py`), which builds the page into a
#    temporary directory and asserts the markup contract `web/assets/replay.js`
#    depends on, that every tool answer is on the page in full, and that
#    nothing is fetched from off the origin at page load.  `deploy` runs only
#    if it passes.
#
#    This workflow does not touch `ci.yml`'s lanes and is not part of its
#    `all-green` gate: a page that fails to build should not block a code
#    change, and a code change that breaks the page is caught by the same
#    tests inside `ci.yml`'s `python-agda-dojang` lane, which already runs
#    `scripts/python/tests`.
#
#    Two jobs, two capabilities.  `verify` runs code the pull request
#    controls and holds `contents: read` and nothing else; `deploy` runs no
#    repository code and is the only job that can publish.  Declaring the
#    Pages tokens workflow-wide, as this did until the review on #166, gave
#    `pages: write` to the job running PR-authored `make` and `pytest`,
#    which on a same-repository branch is a capability and not a formality.
#    GitHub prints each job's grant under "GITHUB_TOKEN Permissions" in its
#    own log, which is where to check this rather than by reading.
#
#  Repository setting, already in place: Settings -> Pages -> "Build and
#    deployment" -> Source: "GitHub Actions".  If it is ever turned off, the
#    deploy step fails with "Get Pages site failed" and nothing else in CI
#    is affected.
#
## =============================================================================
name: Demo site

on:
  # No paths filter here, on purpose.  The page embeds content from several
  # trees (the archive, the obligation files the index names, the ADR's
  # table, the assets), and an allowlist of them is a second copy of that
  # list which drifts: this one already missed
  # `data/benchmarks/**/obligations/*.agda`, whose text is rendered into
  # every replay, so editing an obligation would have left the published
  # page quoting the old one.  A rebuild takes under a minute; a stale
  # published page is a page that lies.  Main rebuilds on every push.
  push:
    branches: [ main ]
  # A filter is fine here, where it only decides whether this extra check
  # runs on a pull request: `ci.yml` runs the same tests unconditionally in
  # its `scripts/python/tests` lane, so nothing goes unverified either way.
  pull_request:
    branches: [ main ]
    paths:
      - 'reports/agent-bench/**'
      - 'data/benchmarks/**'
      - 'scripts/python/demo/**'
      - 'scripts/python/tests/test_demo_*.py'
      - 'scripts/python/utils/**'
      - 'web/**'
      - 'docs/adr/0001-proof-search-on-agda-mcp.md'
      - '.github/workflows/pages.yml'
      - 'Makefile'
  # So the page can be republished without a commit.
  workflow_dispatch:

# Least privilege, and granted per job below rather than here.  `verify`
# checks out and runs code the pull request controls (pytest, make), so it
# gets `contents: read` and nothing else; only `deploy`, which runs no
# repository code at all, holds the tokens that can publish.  Declared
# workflow-wide, they handed `pages: write` to the job running PR-authored
# code, which on a same-repository branch is a real capability: GitHub's own
# job log for the previous revision printed "Pages: write" under the verify
# job's GITHUB_TOKEN permissions.
permissions:
  contents: read

# One deployment at a time, and never cancel one in flight: a half-finished
# deploy would leave the published site in an unknown state.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Demo site • build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs pull-request-controlled code, so it may read the repository and
    # nothing more.  The Pages artifact it uploads needs no permission of
    # its own: an artifact is scoped to the workflow run that made it.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest

      # The suite builds the page into a temporary directory of its own, so
      # this proves the build before the build below writes anything.
      - name: Test the generator and the page it produces
        run: PYTHONPATH=. python3 -m pytest -q scripts/python/tests/test_demo_*.py

      - name: Build the site
        run: make demo

      # A published page must not reach off its own origin at load.  The test
      # suite asserts this on the page it built; this repeats it on the
      # artifact that is actually uploaded, which is the thing being shipped.
      - name: Check the uploaded page fetches nothing off-origin
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/assets/demo.css
          test -f site/assets/replay.js
          if grep -nE '<(script|link|img|iframe)[^>]+(src|href)="(https?:)?//' site/index.html; then
            echo "::error::the built page loads an off-origin asset"
            exit 1
          fi
          echo "the page loads only its own assets"

      - name: Upload the site as a Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Demo site • deploy
    needs: verify
    # Only from the default branch, and only on a push or a manual run: a
    # pull request builds the page and stops there.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that publishes, and so the only one holding the tokens
    # for it.  It checks out nothing and runs no repository code.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
