## =============================================================================
#  pages.yml - build and publish the project site (issues #85, #169)
#  -----------------------------------------------------------------------------
#
#  File: .github/workflows/pages.yml
#
#  Description:
#    Builds the project site with the same Makefile target a developer runs
#    (`make site`: the demo page from the committed archive, then MkDocs
#    Material around it) and deploys the result to GitHub Pages.  Nothing
#    generated is committed: the tree is rebuilt here from `reports/agent-bench/`
#    and `docs/`, which are.
#
#    The toolchain comes from the flake, `nix develop .#site`, which pins
#    mkdocs and mkdocs-material at the versions requirements.txt pins; the
#    Cachix cache makes the shell resolve in seconds once it has been built
#    from `main` once.  The build runs no Agda, starts no server, and makes no
#    network request of its own beyond fetching the toolchain: every input to
#    the site is a file in this repository.
#
#    The `verify` job is the gate, in four steps that each refuse rather than
#    publish something wrong:
#
#      make site-test        the demo's 74 tests (the markup contract
#                            `web/assets/replay.js` depends on, every tool
#                            answer on the page in full, WCAG AA contrast, no
#                            absolute path from the sweep machine) and the
#                            site's own, which build the whole site into a
#                            temporary tree and check it;
#      make site             the real build: `make demo-data` refuses to write
#                            if the table it regenerates from each arm's
#                            `report.json` disagrees with ADR 0001 § 9, the
#                            MkDocs hook refuses a site without a built demo,
#                            and `--strict` refuses a broken link or a page
#                            missing from the nav;
#      make site-check       the off-origin gate over every page and
#                            stylesheet of the uploaded tree, not the demo
#                            page alone as it was before #169 (a theme upgrade
#                            that reintroduced a Google Fonts link would
#                            otherwise ship unnoticed), and every link
#                            resolving;
#      make site-pins-check  requirements.txt and the Nix environment agree.
#
#    `deploy` runs only if `verify` passes, and uploads `public/`, the whole
#    tree: the landing page, the demo under `demo/`, the 404, and the assets.
#
#    This workflow does not touch `ci.yml`'s lanes and is not part of its
#    `all-green` gate: a page that fails to build should not block a code
#    change, and a code change that breaks the demo is caught by the same
#    demo tests inside `ci.yml`'s `python-agda-dojang` lane (the site tests
#    skip there, where mkdocs is absent, and run here, where it is not).
#
#    Two jobs, two capabilities.  `verify` runs code the pull request
#    controls and holds `contents: read` and nothing else; `deploy` runs no
#    repository code and is the only job that can publish.  Declaring the
#    Pages tokens workflow-wide, as this did until the review on #166, gave
#    `pages: write` to the job running PR-authored `make` and `pytest`,
#    which on a same-repository branch is a capability and not a formality.
#    GitHub prints each job's grant under "GITHUB_TOKEN Permissions" in its
#    own log, which is where to check this rather than by reading.
#
#  Repository setting, in place since 2026-09-20 (verify with
#    `gh api repos/formalverification/agda-native-air --jq .has_pages`):
#    Settings -> Pages -> "Build and deployment" -> Source: "GitHub Actions".
#    If it is ever turned off, `deploy` fails and nothing else in CI is
#    affected: this workflow is not part of `ci.yml`'s `all-green` gate.
#
## =============================================================================
name: Project site

on:
  # No paths filter here, on purpose.  The site embeds content from several
  # trees (the archive, the obligation files the index names, the ADR's
  # table, the assets, the pages under docs/), and an allowlist of them is a
  # second copy of that list which drifts: the demo's filter already missed
  # `data/benchmarks/**/obligations/*.agda` once, whose text is rendered into
  # every replay.  A rebuild takes a few minutes; a stale published page is a
  # page that lies.  Main rebuilds on every push.
  push:
    branches: [ main ]
  # A filter is fine here, where it only decides whether this extra check
  # runs on a pull request: `ci.yml` runs the demo tests unconditionally in
  # its `scripts/python/tests` lane, so the demo goes unverified either way
  # only if the site build itself is what broke, and that is what these
  # paths name.
  pull_request:
    branches: [ main ]
    paths:
      - 'reports/agent-bench/**'
      - 'data/benchmarks/**'
      - 'scripts/python/demo/**'
      - 'scripts/python/site/**'
      - 'scripts/python/tests/test_demo_*.py'
      - 'scripts/python/tests/test_site_*.py'
      - 'scripts/python/utils/**'
      - 'web/**'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/pages.yml'
      - 'Makefile'
  # So the site can be republished without a commit.
  workflow_dispatch:

# Least privilege, and granted per job below rather than here.  `verify`
# checks out and runs code the pull request controls (pytest, make), so it
# gets `contents: read` and nothing else; only `deploy`, which runs no
# repository code at all, holds the tokens that can publish.
permissions:
  contents: read

# One deployment at a time, and never cancel one in flight: a half-finished
# deploy would leave the published site in an unknown state.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Project site • build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs pull-request-controlled code, so it may read the repository and
    # nothing more.  The Pages artifact it uploads needs no permission of
    # its own: an artifact is scoped to the workflow run that made it.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The same Nix and Cachix steps as ci.yml's lanes, with one difference
      # the Copilot review of #181 asked for: the write-capable Cachix token
      # is handed to the action only on a push to `main` or a manual run.
      # On a pull request the cache is read-only, because the `make` and
      # `pytest` that follow are pull-request-controlled code, and a token
      # installed for the action is readable by everything after it; a
      # same-repository branch would otherwise get the keys to the cache
      # this job claims to trust only for reading.  The site shell is a
      # Python environment with mkdocs-material rebuilt at the pinned
      # version: the first push to `main` builds it and pushes it, pull
      # requests pull it, and a pull request that changes the pin builds it
      # on the runner (about a minute) without publishing the result.
      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Set up Cachix
        uses: cachix/cachix-action@v16
        with:
          name: formalverification
          authToken: ${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.event_name == 'pull_request' }}

      # Four gates, in the order the header describes.  `set -e` inside the
      # shell string, so the first failing target ends the step.
      - name: Test, build, and check the site
        run: |
          set -euo pipefail
          nix develop .#site --command bash -c '
            set -euo pipefail
            echo "mkdocs: $(mkdocs --version)"
            make site-test
            make site
            make site-check
            make site-pins-check
          '

      # What is uploaded is what was checked: the same tree, and nothing that
      # was not written by `make site`.
      - name: Inventory the tree being uploaded
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/404.html
          test -f public/demo/index.html
          test -f public/demo/assets/demo.css
          test -f public/demo/assets/replay.js
          find public -name '*.html' | sort

      - name: Upload the site as a Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    name: Project site • deploy
    needs: verify
    # Only from the default branch, and only on a push or a manual run: a
    # pull request builds the site and stops there.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that publishes, and so the only one holding the tokens
    # for it.  It checks out nothing and runs no repository code.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
