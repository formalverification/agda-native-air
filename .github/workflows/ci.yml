## =============================================================================
#  ci.yml - CI Pipeline for agda-native-air
#  -----------------------------------------------------------------------------
#
#  File: .github/workflows/ci.yml
#
#  Description:
#    Several CI lanes, all running in parallel.  The `all-green` aggregator
#    gate ensures PRs are only mergeable when every non-skipped lane passes.
#
#    What this workflow does:
#
#    1) Scala (strux-driver)
#       - Set up Temurin JDK 21 (Spark 4.x + Scala 2.13 toolchain)
#       - Use sbt/setup-sbt to install sbt on Ubuntu 24.04 runners
#       - Cache sbt / ivy / coursier
#       - Run `sbt test` in strux-driver/
#       - OPTIONAL: Run a smoke test of Agda2TrainTransformer if the example input exists
#
#    2) Python (ml-pipeline)
#       - Job runs ONLY if the ml-pipeline/ directory exists
#       - Set up Python 3.12
#       - Create a venv inside ml-pipeline/
#       - If requirements.txt exists, install it
#       - If tests exist, run pytest; otherwise skip gracefully
#
#    3) Python (agda-dojang unit tests)
#       - Set up Python 3.12
#       - Run pytest on the pure Python tests (report parser, policy contract,
#         rendering, agent bridge utilities).  No Agda or Nix required.
#
#    4) Python (ml-pipeline tests)
#       - Set up Python 3.12 + venv
#       - Install ml-pipeline dependencies
#       - Run pytest if tests are present
#
#    5) Haskell (agda-strux backend tests)
#       - Set up GHC 9.8.2 + Cabal
#       - Cache ~/.cabal/store + dist-newstyle
#       - Run `make backend-test`
#
#    6) Agda (proof-completion smoke — conditional on agda-dojang/ changes)
#       - Install Nix via cachix/install-nix-action
#       - Restore/push Nix store artifacts via Cachix (see notes below)
#       - Run eval-proof-completion-smoke inside nix develop
#       - Verify determinism by running twice and diffing output
#
#    7) all-green (aggregator gate)
#       - Waits for lanes 1–6.  Uses `if: always()` so that skipped
#         conditional jobs (e.g. lane 6 when no agda-dojang/ changes)
#         don't block the gate.  Fails on `failure` or `cancelled`.
#
#  Notes:
#    - We intentionally do NOT invoke Agda or long training in PR CI.
#    - Add a separate nightly workflow for heavy jobs if desired.
#    - Lane 6 uses Cachix (https://cachix.org) to cache Nix store paths.
#      One-time setup:
#        1.  Install the cachix CLI:  `nix profile install github:cachix/cachix`  (answer yes to cli the questions)
#        2.  On the cli, enter: `cachix authtoken <paste-your-token-here>`
#        3.  Go to [https://app.cachix.org](https://app.cachix.org) → click "Create Cache"
#        4.  Add auth token in the GitHub repo's Actions secrets
#            (Settings → Secrets and variables → Actions → New repository secret).
#            Name it `CACHIX_AUTH_TOKEN`. Without this secret, CI will still work but
#            cold Nix builds will take ~10–15 min instead of ~2–3 min.
#
## =============================================================================
name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Prevent duplicate runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Prevent jobs from using deprecated node version.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scala-strux-driver:
    name: Scala • strux-driver build & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        java-version: [ '21' ]

    steps:
      # --- Checkout ---
      - name: Checkout
        uses: actions/checkout@v6

      # --- JDK 21 ---
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: sbt

      # --- sbt (fix for 'Unable to locate package sbt' on Ubuntu 24.04) ---
      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      # --- Optional extra caches (Ivy / Coursier) ---
      - name: Cache Ivy/Coursier
        uses: actions/cache@v5
        with:
          path: |
            ~/.ivy2/cache
            ~/.cache/coursier
            ~/.sbt
          key: ${{ runner.os }}-ivycs-${{ hashFiles('**/*.sbt', 'strux-driver/project/build.properties', 'strux-driver/project/**/*.scala') }}
          restore-keys: |
            ${{ runner.os }}-ivycs-

      # --- sbt test ---
      - name: sbt test (strux-driver)
        working-directory: strux-driver
        run: sbt -v test

      # --- OPTIONAL smoke test of Agda2TrainTransformer ---
      # This step only runs if a plausible example JSON is present.
      - name: Run Agda2TrainTransformer smoke test (optional)
        working-directory: strux-driver
        run: |
          set -euxo pipefail
          # Adjust this if your example lives elsewhere:
          INPUT_JSON="data/agda/agda-example.json"
          if [ -f "$INPUT_JSON" ]; then
            mkdir -p ../target
            sbt "runMain struxdriver.transform.Agda2TrainTransformer $INPUT_JSON ../target/a2t.sample.jsonl"
            test -s ../target/a2t.sample.jsonl
            echo "Smoke test OK: ../target/a2t.sample.jsonl"
          else
            echo "No example JSON at $INPUT_JSON; skipping smoke test."
          fi

      # Upload artifact if the smoke test produced one
      - name: Upload transformer artifact (if present)
        if: ${{ hashFiles('target/a2t.sample.jsonl') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: a2t-sample-jsonl
          path: target/a2t.sample.jsonl
          if-no-files-found: ignore

  scala-ml-pipeline-etl:
    name: Scala • ml-pipeline ETL smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        java-version: [ '21' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: sbt
          cache-dependency-path: |
            ml-pipeline/**/*.sbt
            ml-pipeline/project/build.properties
            ml-pipeline/project/**/*.scala

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      # ETL smoke test: runs quickly + deterministically (fixture-driven)
      - name: sbt testOnly etl.PreprocessAgdaSpec (ml-pipeline/etl)
        working-directory: ml-pipeline
        run: |
          set -euxo pipefail
          sbt -v "project etl" "testOnly etl.PreprocessAgdaSpec"

      # Proof-completion dataset builder smoke (fixture-driven)
      # Uses committed fixture: ml-pipeline/etl/src/test/resources/proof-completion.smoke.jsonl
      - name: make etl-proof-completion-dataset-smoke
        run: |
          set -euxo pipefail
          make etl-proof-completion-dataset-smoke PROOF_COMPLETION_SMOKE_LIMIT=200

  python-agda-dojang:
    name: Python • agda-dojang unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pytest
        run: pip install pytest
      - name: Run pure unit tests (no Agda required)
        working-directory: agda-dojang
        run: |
          PYTHONPATH=python python3 -m pytest -q \
            python/tests/test_rendering.py \
            python/tests/test_parse_request.py \
            python/tests/test_policy_contract.py \
            python/tests/test_report_parser.py

  python-ml-pipeline:
    name: Python • ml-pipeline tests
    runs-on: ubuntu-latest
    # Only run this job if the ml-pipeline directory exists in the repo
    # if: ${{ hashFiles('ml-pipeline/**') != '' }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          # NOTE: We omit cache-dependency-path because the file may not exist in all commits.
          cache: 'pip'

      - name: Set up virtualenv
        working-directory: ml-pipeline
        shell: bash
        run: |
          set -euxo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          if [ -f python/requirements.txt ]; then
            pip install -r python/requirements.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found; skipping dependency install."
          fi
          python -c "import pandas, pyarrow; print('pandas', pandas.__version__, 'pyarrow', pyarrow.__version__)"

      - name: Run pytest if tests present
        working-directory: ml-pipeline
        shell: bash
        run: |
          set -euxo pipefail
          . .venv/bin/activate
          if find python/tests \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            pytest -q python/tests
          else
            echo "No Python tests found in ml-pipeline/python/tests; skipping pytest."
          fi

  haskell-backend-jsonl:
    name: Haskell • agda-strux tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Haskell (GHC + Cabal)
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.8.2'
          cabal-version: 'latest'
          cabal-update: true

      - name: Cache Cabal store + dist-newstyle (backend)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cabal/store
            ~/.cabal/packages
            agda-strux/dist-newstyle
          key: ${{ runner.os }}-ghc9.8.2-cabal-${{ hashFiles('agda-strux/*.cabal', 'agda-strux/cabal.project', 'agda-strux/cabal.project.freeze') }}
          restore-keys: |
            ${{ runner.os }}-ghc9.8.2-cabal-

      - name: backend-test
        run: make backend-test BACKEND_USE_NIX=0 BACKEND_TEST_KEEP=0

  # ---------------------------------------------------------------------------
  # Agda • proof-completion smoke (requires Nix → Agda + stdlib)
  #
  # Conditional: only runs when agda-dojang/ or data/agda/ files change.
  #
  # Runtime with warm Cachix cache: ~2–3 min.
  # First ever run (or after flake.lock bump): ~10–15 min, but the built
  # paths are pushed to Cachix automatically so subsequent runs are fast.
  # ---------------------------------------------------------------------------
  agda-dojang-eval:
    name: Agda • proof-completion smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # -- Path-change detection --
      # We only install Nix / run Agda when files that could affect the
      # evaluator have changed.  This keeps unrelated PRs fast.
      # Trigger paths: agda-dojang/, data/agda/, flake.nix, flake.lock.
      - name: Detect relevant changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if ! CHANGED=$(git diff --name-only "$BASE" HEAD -- \
            'agda-dojang/' 'data/agda/' 'flake.nix' 'flake.lock'); then
            echo "Error: failed to compute diff between $BASE and HEAD."
            exit 1
          fi
          if [ -n "$CHANGED" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Changed files in scope:"
            echo "$CHANGED"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No agda-dojang or fixture changes detected; skipping."
          fi

      # -- Nix + Cachix --
      - name: Install Nix
        if: steps.changes.outputs.run == 'true'
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # Cachix provides a shared binary cache for Nix store paths.
      # On cache hit, `nix develop` resolves in seconds instead of
      # building Agda + stdlib from source (~12 min).
      # If CACHIX_AUTH_TOKEN is missing, this step is a no-op read-only
      # pull from the public cache (safe for external contributor PRs).
      - name: Set up Cachix

        if: steps.changes.outputs.run == 'true'
        uses: cachix/cachix-action@v16
        with:
          name: formalverification
          # Push built paths so future runs are fast.  Falls back to
          # read-only if the secret is not set (e.g. external forks).
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      # -- Smoke test --
      - name: Run eval-proof-completion-smoke
        if: steps.changes.outputs.run == 'true'
        run: |
          set -euxo pipefail
          nix develop .#all --command bash -c '
            echo "Agda: $(agda --version)"
            echo "Python: $(python3 --version)"
            make eval-proof-completion-smoke
          '

      # -- Determinism verification --
      - name: Verify deterministic output
        if: steps.changes.outputs.run == 'true'
        run: |
          set -euxo pipefail
          nix develop .#all --command bash -c '
            cp agda-dojang/_build/eval-proof-completion/smoke/fixtures.jsonl \
               /tmp/fixtures-run1.jsonl
            make eval-proof-completion-smoke
            python3 -c "
          import json, sys
          def normalize(path):
              with open(path) as f:
                  rows = [json.loads(line) for line in f if line.strip()]
              for r in rows:
                  r.pop(\"elapsedMs\", None)
              return rows
          r1 = normalize(\"/tmp/fixtures-run1.jsonl\")
          r2 = normalize(\"agda-dojang/_build/eval-proof-completion/smoke/fixtures.jsonl\")
          if r1 == r2:
              print(\"Determinism check passed.\")
          else:
              print(\"DETERMINISM FAILURE\", file=sys.stderr)
              print(\"Run 1:\", json.dumps(r1, indent=2), file=sys.stderr)
              print(\"Run 2:\", json.dumps(r2, indent=2), file=sys.stderr)
              sys.exit(1)
            "
          '

      - name: Skip notice
        if: steps.changes.outputs.run != 'true'
        run: echo "agda-dojang-eval skipped (no relevant file changes)."

  # ---------------------------------------------------------------------------
  # Aggregate status: all required jobs must pass.
  # Uses if: always() so that skipped conditional jobs don't block the gate.
  # ---------------------------------------------------------------------------
  all-green:
    name: All checks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: always()
    needs: [ scala-strux-driver, scala-ml-pipeline-etl, python-ml-pipeline, haskell-backend-jsonl, python-agda-dojang, agda-dojang-eval ]
    steps:
      - name: Check results
        run: |
          results=( \
            "${{ needs.scala-strux-driver.result }}" \
            "${{ needs.scala-ml-pipeline-etl.result }}" \
            "${{ needs.python-ml-pipeline.result }}" \
            "${{ needs.haskell-backend-jsonl.result }}" \
            "${{ needs.python-agda-dojang.result }}" \
            "${{ needs.agda-dojang-eval.result }}" \
          )
          for r in "${results[@]}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "A required job failed or was cancelled: $r"
              exit 1
            fi
          done
          echo "All jobs passed (skipped jobs are OK). ✅"
