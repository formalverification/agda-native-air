# File: .github/ISSUE_TEMPLATE/bug_report.yml
name: Bug report
description: Report something that is broken or behaving incorrectly.
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug.  A minimal, reproducible example is the single
        most useful thing you can provide.  If a workflow depends on the Nix
        shell, please say which shell you used.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands (e.g. the `make` target and/or `nix develop` shell) and a minimal input.
      placeholder: |
        1. nix develop .#backend
        2. make ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS; whether you were inside a Nix shell; relevant tool versions (`agda --version`, `ghc --version`, `sbt`, `python3 --version`).
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Paste any error output.  It will be rendered as code, so no backticks are needed.
      render: shell
    validations:
      required: false
