# ============================================================================
# Notes / How to run today (manual)
# ============================================================================
# 
# Current ETL workflow:
# 
# 1. Extraction (prerequisite):
#    $ make extract-lib
#    → Produces data/agda-algebras/raw/jsonl/*.jsonl files
# 
# 2. Merge (orchestrator step; today you can do it manually):
#    $ cat data/agda-algebras/raw/jsonl/*.jsonl > data/agda-algebras/raw/jsonl/combined.jsonl
#
# 3. ETL (Spark JSONL → Parquet):
#    $ cd ml-pipeline && sbt "project etl" "runMain etl.PreprocessAgda \
#        ../data/agda-algebras/raw/jsonl/combined.jsonl data/agda-algebras"
#    → Reads JSONL, extracts features, writes train.parquet and test.parquet
# Outputs:
# - ml-pipeline/data/agda-algebras/train.parquet
# - ml-pipeline/data/agda-algebras/test.parquet
# Future workflow (once one-command orchestration exists):
#    $ ml-pipeline one-command etl --config configs/agda-algebras.yaml
#    → Reads input.paths, merges, applies ETL, writes to output.{train,test}_path
# 
# Current Status:
#   - ETL pipeline: PreprocessAgda.scala (implemented)
#   - Config-driven orchestration: future work
#   - This file documents the intended ETL configuration contract
