# file: configs/log4j2.properties
status = warn
name = AgdaAiProverQuiet

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %-5p %c{1}: %m%n

rootLogger.level = warn
rootLogger.appenderRefs = console
rootLogger.appenderRef.console.ref = console

# Spark + Hadoop are very chatty at INFO by default
logger.spark.name = org.apache.spark
logger.spark.level = warn

logger.sparkSql.name = org.apache.spark.sql
logger.sparkSql.level = warn

logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = error

# Common noisy deps
logger.netty.name = io.netty
logger.netty.level = error

logger.akka.name = akka
logger.akka.level = warn

# Parquet can spam schema dumps at INFO
logger.parquet.name = org.apache.parquet
logger.parquet.level = warn

# If you still see lots of commit protocol spam, uncomment:
# logger.sparkHadoopCommit.name = org.apache.spark.internal.io
# logger.sparkHadoopCommit.level = warn
